const fmtDate = (v) => v ? new Date(v).toLocaleString(undefined, { dateStyle: 'full', timeStyle: 'short' }) : '';
const fmtBirth = (v) => { if (!v) return ''; const [y, m] = v.split('-'); return new Date(y, m - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' }); };

/* =====================================================================
   PARTY RULES — pure business logic. NO DOM, NO Firebase, NO globals.
   Every function takes plain data (and an optional `now` for testing) and returns plain data.
   Migration: move this whole block to `partyRules.js` and `export` it
   (React/Vue import it as-is; a backend API can reuse the same rules).
   ===================================================================== */
const PartyRules = (() => {
  const STATUS = Object.freeze({ UPCOMING: 'Upcoming', ACTIVE: 'Active', CLOSED: 'Closed' });
  const pad = (n) => String(n).padStart(2, '0');

  // "YYYY-MM-DDTHH:mm" (datetime-local value) -> Date, or null when empty/invalid.
  const parseLocal = (v) => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; };
  const floorToMinute = (d) => { const x = new Date(d); x.setSeconds(0, 0); return x; };
  const toLocalInput = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

  // The moment a party stops counting: its end, or its start when there is no (valid) end.
  const partyEnd = (party) => {
    const s = parseLocal(party.when), e = parseLocal(party.endWhen);
    return e && s && e >= s ? e : s;
  };

  // Upcoming: not started yet · Active: started, end not reached · Closed: end (or start, if no end) has passed.
  const getEventStatus = (party, now = new Date()) => {
    const s = parseLocal(party.when), e = partyEnd(party);
    if (!s || !e) return STATUS.CLOSED;
    if (now >= e) return STATUS.CLOSED;
    if (now >= s) return STATUS.ACTIVE;
    return STATUS.UPCOMING;
  };
  const isClosed = (party, now) => getEventStatus(party, now) === STATUS.CLOSED;

  // Active + upcoming (soonest first) vs closed archive (most recently finished first).
  const splitByStatus = (parties, now = new Date()) => {
    const open = [], closed = [];
    parties.forEach((p) => (isClosed(p, now) ? closed : open).push(p));
    open.sort((a, b) => parseLocal(a.when) - parseLocal(b.when));
    closed.sort((a, b) => partyEnd(b) - partyEnd(a));
    return { open, closed };
  };

  // Guest tally for one party.
  const tally = (guests) => {
    const c = { total: guests.length, accepted: 0, declined: 0, pending: 0, people: 0 };
    guests.forEach((g) => { c[g.status]++; if (g.status === 'accepted') c.people += (g.count || 1); });
    return c;
  };
  // Dashboard summary: counts ONLY the parties passed in (callers pass the non-closed ones).
  const summarizeParties = (parties, guestsByParty) => {
    const c = PartyRules.tally(parties.flatMap((p) => guestsByParty[p.id] || []));
    return { parties: parties.length, ...c };
  };

  /* ---- Form rules ---- */
  const MSG = {
    name:    'Please enter a party title / name.',
    birth:   'Please pick the birth month and year.',
    when:    'Please choose when the party starts.',
    past:    'The start can’t be in the past — choose the current time or later.',
    end:     'The end can’t be earlier than the start.',
    venue:   'Please enter the venue or address.',
    rsvp:    'The RSVP deadline must be on or before the party day.',
  };
  const FIELD_ORDER = ['name', 'birth', 'when', 'endWhen', 'venue', 'rsvpBy'];

  // values: { name, birth, when, endWhen, venue, rsvpBy } (strings).  ctx: { now, original } — `original` is the saved
  // party when editing, so an unchanged (already past) start isn't rejected.
  const validateParty = (values, { now = new Date(), original = null } = {}) => {
    const errors = {};
    const s = parseLocal(values.when);
    if (!(values.name || '').trim()) errors.name = MSG.name;
    if (!values.birth) errors.birth = MSG.birth;
    if (!values.when || !s) errors.when = MSG.when;
    else if (!(original && values.when === original.when) && s < floorToMinute(now)) errors.when = MSG.past;
    const e = parseLocal(values.endWhen);
    if (e && s && e < s) errors.endWhen = MSG.end;
    if (!(values.venue || '').trim()) errors.venue = MSG.venue;
    if (values.rsvpBy && values.when && values.rsvpBy > values.when.slice(0, 10)) errors.rsvpBy = MSG.rsvp;
    const firstInvalid = FIELD_ORDER.find((k) => errors[k]) || null;
    return { errors, firstInvalid, valid: !firstInvalid };
  };

  // Bounds for the date pickers so invalid choices are greyed out (the rules above stay the source of truth).
  const pickerLimits = (values, { now = new Date(), original = null } = {}) => {
    const startIsPast = original && parseLocal(original.when) < floorToMinute(now);
    return {
      startMin: startIsPast ? '' : toLocalInput(floorToMinute(now)),
      endMin: values.when || '',
      rsvpMax: values.when ? values.when.slice(0, 10) : '',
    };
  };

  return { STATUS, parseLocal, partyEnd, getEventStatus, isClosed, splitByStatus, tally, summarizeParties, validateParty, pickerLimits };
})();
/* ===================== END PARTY RULES ===================== */

/* =====================================================================
   ADMIN · PLAN · DISCOUNT RULES — pure business logic (no DOM, no Firebase).
   Kept apart from PartyRules and from all host screens. Migration: move to `src/rules/adminRules.js` and export.
   ===================================================================== */
const AdminRules = (() => {
  // Roles are DERIVED from the verified sign-in email — never read from a stored field a user could edit.
  //   SUPER_ADMIN = SUPER_ADMIN_EMAIL (config; mirrored in firestore.rules) · ADMIN = email listed in Firestore admins/{email} · USER = anyone else.
  const ROLES = Object.freeze({ SUPER_ADMIN: 'SUPER_ADMIN', ADMIN: 'ADMIN', USER: 'USER', GUEST: 'GUEST' });
  const norm = (e) => String(e || '').trim().toLowerCase();
  const getRole = (email, adminEmails = []) => {
    const e = norm(email);
    if (!e) return ROLES.GUEST;
    if (e === norm(SUPER_ADMIN_EMAIL)) return ROLES.SUPER_ADMIN;
    return adminEmails.map(norm).includes(e) ? ROLES.ADMIN : ROLES.USER;
  };
  const isSuperAdmin = (email) => getRole(email) === ROLES.SUPER_ADMIN;
  const isAdmin = (email, adminEmails = []) => { const r = getRole(email, adminEmails); return r === ROLES.SUPER_ADMIN || r === ROLES.ADMIN; };

  // One table decides who may do what (UI and, later, a backend can share it). Firestore rules enforce the same split.
  const PERMISSIONS = Object.freeze({
    useDuringMaintenance: [ROLES.SUPER_ADMIN, ROLES.ADMIN],
    configurePlatform:    [ROLES.SUPER_ADMIN, ROLES.ADMIN],      // maintenance switch, discounts, assign client plans
    managePlans:          [ROLES.SUPER_ADMIN],                   // Plans & limits: create / edit / delete plans (rules enforce the same)
    manageAdmins:         [ROLES.SUPER_ADMIN],                   // add / remove other admins
    viewGuestEmails:      [ROLES.SUPER_ADMIN],                   // Users tab: see invitee email addresses (others see counts only)
  });
  const can = (role, action) => (PERMISSIONS[action] || []).includes(role);

  // Maintenance: everyone without the permission is blocked while the flag is on.
  const canUseApp = (config, email, adminEmails = []) => !(config && config.maintenance) || can(getRole(email, adminEmails), 'useDuringMaintenance');

  // Validates an email being added as an admin. Returns { email, error }.
  const validateAdminEmail = (raw, existing = []) => {
    const email = norm(raw);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { email, error: 'Enter a valid email address.' };
    if (email === norm(SUPER_ADMIN_EMAIL)) return { email, error: 'That is the Super Admin — already has full access.' };
    if (existing.map(norm).includes(email)) return { email, error: 'That email is already an admin.' };
    return { email, error: '' };
  };

  // Platform aggregation: clients per plan. Admins are exempt from plans, so they are not counted.
  const planBreakdown = (users, plans, adminEmails = []) => {
    const def = (plans.find(p => p.isDefault) || plans.find(p => p.id === 'free') || {}).id || 'free';
    const counts = {};
    users.filter(u => !isAdmin(u.email, adminEmails)).forEach(u => { const id = u.planId || def; counts[id] = (counts[id] || 0) + 1; });
    return Object.entries(counts).map(([id, count]) => ({ id, name: (plans.find(p => p.id === id) || {}).name || id, count })).sort((a, b) => b.count - a.count);
  };
  // Active subscriptions per plan. subs: [{uid, planId, status, startDate}] (all hosts). Only each host's latest active one counts.
  const subscriptionBreakdown = (subs, plans) => {
    const latest = {};
    subs.filter(s => s.status === 'active').forEach(s => { const cur = latest[s.uid]; if (!cur || (s.startDate?.seconds || 0) >= (cur.startDate?.seconds || 0)) latest[s.uid] = s; });
    const counts = {};
    Object.values(latest).forEach(s => { counts[s.planId] = (counts[s.planId] || 0) + 1; });
    return Object.entries(counts).map(([id, count]) => ({ id, name: (plans.find(p => p.id === id) || {}).name || id, count })).sort((a, b) => b.count - a.count);
  };
  const getUserRole = getRole;      // spec alias
  return { ROLES, getRole, getUserRole, isSuperAdmin, isAdmin, can, canUseApp, validateAdminEmail, planBreakdown, subscriptionBreakdown };
})();

const PlanRules = (() => {

  // The five Planet Passes (seed data for the plans collection; every value stays editable in Admin). Features add up tier by tier.
  // price = what the host pays (one time); anchorPrice = the optional “regular price” shown struck through (0 = hidden).

    if (raw.value === '' || !isFinite(v)) errors.value = 'Enter a value.';
    else if (Math.abs(v * 100 - Math.round(v * 100)) > 1e-6) errors.value = 'At most 2 decimal places.';

  const snapList = (s) => s.docs.map(d => ({ id: d.id, ...d.data() }));
  const byCreated = (a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
  const newestFirst = (a, b) => byCreated(b, a);
  const legacyGuests = (pid) => collection(db, 'parties', pid, 'guests');
  const auditEntry = (by, planId, planName, action, changes = {}) => ({ planId, planName: planName || '', action, by, at: serverTimestamp(), changes });

  const Repo = {
    auth: {
      onChange:         (cb) => onAuthStateChanged(auth, cb),
      signInWithGoogle: () => signInWithPopup(auth, new GoogleAuthProvider()),
      signOut:          () => signOut(auth),
    },

    // Platform config: { maintenance, message }
    config: {
      watch: (onData, onError) => onSnapshot(P.config(), (s) => onData({ maintenance: false, message: '', ...(s.exists() ? s.data() : {}) }), onError),
      get:   async () => { const s = await getDoc(P.config()); return s.exists() ? s.data() : {}; },
      save:  (patch, byEmail) => setDoc(P.config(), { ...patch, updatedAt: serverTimestamp(), updatedBy: byEmail }, { merge: true }),
    },

    // The signed-in host's own profile (users/{uid}). Never writes planId.
    profile: {
      save: async (u) => {                                  // best effort: the app works even if this fails
        try {
          const ref = P.user(u.uid), snap = await getDoc(ref);
          const base = { displayName: u.displayName || '', email: u.email || '', photoURL: u.photoURL || '', lastLoginAt: serverTimestamp() };
          await setDoc(ref, snap.exists() ? base : { ...base, createdAt: serverTimestamp() }, { merge: true });
        } catch (e) { console.warn('profile not saved', e); }
      },
      planId: async (uid) => { const s = await getDoc(P.user(uid)); return s.exists() ? (s.data().planId || null) : null; },
    },

    // Secondary admins: admins/{email}. (The Super Admin is configuration, not a record.)
    admins: {
      has:    async (email) => (await getDoc(P.admin(email))).exists(),
      list:   async () => snapList(await getDocs(collection(db, 'admins'))),
      add:    (email, byEmail) => setDoc(P.admin(email), { email, addedBy: byEmail, addedAt: serverTimestamp() }),
      remove: (email) => deleteDoc(P.admin(email)),
    },

    // Plans. Every change is written together with an audit entry (who, when, what) in one batch.
    plans: {
      list:       async () => snapList(await getDocs(P.plans())),
      audit:      async (n = 30) => snapList(await getDocs(query(P.planAudit(), orderBy('at', 'desc'), limit(n)))),
      seed:       async (plans, byEmail) => { const b = writeBatch(db); plans.forEach(p => { const { id, ...data } = p; b.set(P.plan(id), { ...data, updatedAt: serverTimestamp(), updatedBy: byEmail }); b.set(doc(P.planAudit()), auditEntry(byEmail, id, p.name, 'seed')); }); await b.commit(); },
      create:     async (id, data, byEmail) => { const b = writeBatch(db); b.set(P.plan(id), { ...data, updatedAt: serverTimestamp(), updatedBy: byEmail }); b.set(doc(P.planAudit()), auditEntry(byEmail, id, data.name, 'create')); await b.commit(); },
      update:     async (id, data, byEmail, changes) => { const b = writeBatch(db); b.update(P.plan(id), { ...data, updatedAt: serverTimestamp(), updatedBy: byEmail }); b.set(doc(P.planAudit()), auditEntry(byEmail, id, data.name, 'update', changes)); await b.commit(); },
      remove:     async (id, name, byEmail) => { const b = writeBatch(db); b.delete(P.plan(id)); b.set(doc(P.planAudit()), auditEntry(byEmail, id, name, 'delete')); await b.commit(); },
      setDefault: async (allIds, id, name, byEmail) => { const b = writeBatch(db); allIds.forEach(x => b.update(P.plan(x), { isDefault: x === id })); b.set(doc(P.planAudit()), auditEntry(byEmail, id, name, 'default')); await b.commit(); },
    },

    users: {
      list:    async () => snapList(await getDocs(P.users())),
      count:   async () => (await getCountFromServer(P.users())).data().count,
    },

    // users/{uid}/subscriptions/{id}: { planId, status: active|cancelled|expired, startDate, expiresAt, appliedDiscountCode }
    subscriptions: {
      list:    async (uid) => snapList(await getDocs(P.subs(uid))),
      listAll: async () => (await getDocs(collectionGroup(db, 'subscriptions'))).docs.map(d => ({ id: d.id, uid: d.ref.path.split('/')[1], ...d.data() })),
      // A host's one-and-only self-service signup (free plans only; the database rules allow exactly this document id).
      startFree: (uid, planId, code = '', expiresAtMs = null) => setDoc(P.sub(uid, 'free-signup'), { planId, status: 'active', startDate: serverTimestamp(), appliedDiscountCode: code || '', source: 'self', ...(expiresAtMs ? { expiresAt: new Date(expiresAtMs) } : {}) }),
      // Admin: move a client to a plan. Cancels their active subscriptions, creates a new active one, mirrors planId on the profile.
      assign: async (uid, planId, byEmail, expiresAtMs = null) => {
        const old = snapList(await getDocs(P.subs(uid))).filter(s => s.status === 'active');
        const ref = doc(P.subs(uid)), b = writeBatch(db);
        old.forEach(s => b.update(P.sub(uid, s.id), { status: 'cancelled', endDate: serverTimestamp() }));
        b.set(ref, { planId, status: 'active', startDate: serverTimestamp(), appliedDiscountCode: '', source: 'admin', assignedBy: byEmail, ...(expiresAtMs ? { expiresAt: new Date(expiresAtMs) } : {}) });
        b.set(P.user(uid), { planId, currentSubscriptionId: ref.id }, { merge: true });
        await b.commit(); return ref.id;
      },
    },

    parties: {
      list:     async (uid) => snapList(await getDocs(P.parties(uid))).sort(newestFirst),
      // Each party is written together with its numbered, create-only log entry. The database rules accept entry n only while
      // n is below the plan's lifetime limit, and entries can never be deleted — so deleting parties never frees a slot.
      create:   async (uid, data) => {
        for (let attempt = 0; ; attempt++) {
          const seq = (await getCountFromServer(P.partyLog(uid))).data().count, ref = doc(P.parties(uid)), b = writeBatch(db);
          b.set(P.partyLogEntry(uid, seq), { partyId: ref.id, createdAt: serverTimestamp() });
          b.set(ref, { ...data, logSeq: seq, createdAt: serverTimestamp() });
          try { await b.commit(); return ref.id; }
          catch (e) { if (attempt >= 1) { e.limit = e.code === 'permission-denied'; throw e; } }      // one retry covers two tabs creating at once
        }
      },
      update:   (uid, pid, data) => updateDoc(P.party(uid, pid), data),
      remove:   async (uid, pid, guestIds) => { const b = writeBatch(db); guestIds.forEach(g => b.delete(P.guest(uid, pid, g))); b.delete(P.party(uid, pid)); await b.commit(); },
      countAll: async () => (await getCountFromServer(collectionGroup(db, 'parties'))).data().count,
      listAll:  async () => (await getDocs(collectionGroup(db, 'parties'))).docs.map(d => ({ id: d.id, uid: d.ref.path.split('/')[1], ...d.data() })),   // admins: every host's parties
      addSent:  (uid, pid, n) => updateDoc(P.party(uid, pid), { emailsSent: increment(n) }),
    },

    guests: {
      watch:    (uid, pid, onData, onError) => onSnapshot(P.guests(uid, pid), (s) => onData(snapList(s).sort(byCreated)), onError),   // returns unsubscribe
      remove:   (uid, pid, gid) => deleteDoc(P.guest(uid, pid, gid)),
      list:     async (uid, pid) => snapList(await getDocs(P.guests(uid, pid))),            // admins: one party's guest list
      markSent: (uid, pid, gid) => updateDoc(P.guest(uid, pid, gid), { invitedAt: serverTimestamp() }),
      resetAll: async (uid, pid, guestIds) => { const b = writeBatch(db); guestIds.forEach(g => b.update(P.guest(uid, pid, g), { status: 'pending', name: '', count: 0 })); await b.commit(); },
    },

    // Per-host daily counters (emails sent today)
    // Invitations: each one is a numbered, create-only log entry written together with its guest. The database rules accept
    // entry n only while n is below the plan's email limit, so the limit holds even if the app is bypassed.
    invitations: {
      list: async (uid, pid) => snapList(await getDocs(P.invites(uid, pid))).map(x => ({ seq: Number(x.id), email: x.email, at: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : Date.now() })).sort((a, b) => a.seq - b.seq),
      add: async (uid, pid, email) => {
        for (let attempt = 0; ; attempt++) {
          const seq = (await getCountFromServer(P.invites(uid, pid))).data().count, gref = doc(P.guests(uid, pid)), b = writeBatch(db);
          b.set(P.invite(uid, pid, seq), { email, guestId: gref.id, createdAt: serverTimestamp() });
          b.set(gref, { email, status: 'pending', name: '', count: 0, inviteSeq: seq, createdAt: serverTimestamp() });
          try { await b.commit(); return gref.id; }
          catch (e) { if (attempt >= 1) { e.limit = e.code === 'permission-denied'; throw e; } }      // one retry covers two tabs adding at once
        }
      },
    },

    discounts: {
      list:   async () => snapList(await getDocs(P.discounts())).sort((a, b) => a.code.localeCompare(b.code)),
      create: (code, data) => setDoc(P.discount(code), { code, ...data, used: 0, active: true, createdAt: serverTimestamp() }),
      update: (code, data) => updateDoc(P.discount(code), { ...data, updatedAt: serverTimestamp() }),
      remove: (code) => deleteDoc(P.discount(code)),
      lookup: async (code) => { const s = await getDoc(P.discount(code)); return s.exists() ? { id: s.id, ...s.data() } : null; },   // exact code only — hosts cannot list codes
    },

    // v16 -> nested migration. Same ids; a stub is left at the old path so earlier links redirect.
    legacy: {
      list: async (uid) => snapList(await getDocs(query(collection(db, 'parties'), where('ownerUid', '==', uid)))).filter(x => !x.movedTo),
      migrate: async (uid, legacyParties) => {
        const commit = async (ops) => { for (let i = 0; i < ops.length; i += 400) { const b = writeBatch(db); ops.slice(i, i + 400).forEach(fn => fn(b)); await b.commit(); } };
        for (const lp of legacyParties) {
          const gs = await getDocs(legacyGuests(lp.id));
          const { id, ownerUid, ...pdata } = lp;
          await commit([b => b.set(P.party(uid, lp.id), pdata), ...gs.docs.map(g => b => b.set(P.guest(uid, lp.id, g.id), g.data()))]);
          await commit([...gs.docs.map(g => b => b.delete(doc(db, 'parties', lp.id, 'guests', g.id))), b => b.set(doc(db, 'parties', lp.id), { ownerUid: uid, movedTo: uid })]);
        }
      },
    },

    // What a guest does with their personal link (no sign-in).
    invitation: {
      load: async ({ owner, pid, token }) => {
        let ps = await getDoc(owner ? P.party(owner, pid) : doc(db, 'parties', pid));
        if (ps.exists() && !owner && ps.data().movedTo) { owner = ps.data().movedTo; ps = await getDoc(P.party(owner, pid)); }   // old link to a migrated party
        const gs = await getDoc(owner ? P.guest(owner, pid, token) : doc(db, 'parties', pid, 'guests', token));
        if (!ps.exists() || !gs.exists()) throw new Error('missing');
        return { party: ps.data(), guest: gs.data(), owner };
      },
      reply: ({ owner, pid, token }, { status, name, count }) =>
        updateDoc(owner ? P.guest(owner, pid, token) : doc(db, 'parties', pid, 'guests', token), { status, name, count, respondedAt: serverTimestamp() }),
    },
  };
  /* ===================================== END DATA LAYER ===================================== */

  if (params.get('partyId') && params.get('t')) guestView();
  else organizerApp();

  /* ============================ GUEST VIEW (unchanged) ============================ */
  async function guestView() {
    const pid = params.get('partyId'), token = params.get('t');
    let owner = params.get('o') || '';               // host uid (new links); empty = old v16 link
    const guestEmail = (params.get('guestEmail') || '').toLowerCase();
    app.innerHTML = `<p class="text-center text-slate-500 mt-20">Loading your invitation…</p>`;
    let party, guest;
    try {
      ({ party, guest, owner } = await Repo.invitation.load({ owner, pid, token }));
    } catch {
      app.innerHTML = `<div class="max-w-md mx-auto bg-white rounded-2xl shadow p-8 text-center"><div class="text-5xl mb-3">🤔</div><h1 class="text-xl font-bold">Invitation not found</h1><p class="text-slate-500 mt-2">Please ask the host to send the link again.</p></div>`;
      return;
    }
    const email = guest.email || guestEmail;
    let mine = guest.status !== 'pending' ? { status: guest.status, name: guest.name, count: guest.count ?? (guest.status === 'accepted' ? 1 : 0) } : null;
    let tick;
    const extrasHtml = () => `
      <p id="countdown" class="mt-4 font-semibold text-pink-600">${esc(countdownText(party.when))}</p>
      <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
        <a href="${esc(googleCalUrl(party))}" target="_blank" rel="noopener" class="py-2 rounded-lg bg-indigo-50 text-indigo-700 text-center font-medium hover:bg-indigo-100">📆 Google Calendar</a>
        <button id="icsBtn" type="button" class="py-2 rounded-lg bg-indigo-50 text-indigo-700 font-medium hover:bg-indigo-100">⬇️ Apple / Outlook</button>
      </div>`;
    const wireExtras = () => {
      const b = $('#icsBtn'); if (b) b.onclick = () => downloadIcs(party, pid);
      clearInterval(tick);
      tick = setInterval(() => { const c = $('#countdown'); if (c) c.textContent = countdownText(party.when); }, 30000);
    };
    render();

    function render() {
      if (mine) return done();
      app.innerHTML = `
      <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="h-3 bg-gradient-to-r from-pink-400 via-amber-300 to-indigo-400"></div>
        <img src="${esc(party.photo || placeholderImg)}" onerror="this.src='${placeholderImg}'" alt="Birthday photo" class="w-full h-72 object-cover">
        <div class="p-6 text-center">
          <p class="text-sm uppercase tracking-widest text-pink-500 font-semibold">You're invited 🎈</p>
          <h1 class="text-3xl font-extrabold mt-1">${esc(party.name)}'s Birthday</h1>
          ${turning(party.birth, party.when) ? `<div class="inline-block mt-2 px-5 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-amber-500 text-white font-extrabold text-xl shadow">🎈 Turning ${turning(party.birth, party.when)}!</div>` : ''}
          <p class="text-slate-500 mt-2">Born ${esc(fmtBirth(party.birth))}</p>
          <div class="mt-5 space-y-2 text-left bg-pink-50 rounded-xl p-4 text-sm">
            <p>📅 <b>${esc(fmtRange(party.when, party.endWhen))}</b></p>
            <p>📍 <a href="${esc(mapUrl(party.venue))}" target="_blank" rel="noopener" class="text-indigo-600 underline">${esc(party.venue)}</a> <span class="text-slate-400">· tap for map</span></p>
            ${party.theme ? `<p>👗 Dress code / theme: <b>${esc(party.theme)}</b></p>` : ''}
            ${party.rsvpBy ? `<p>⏰ Please reply by <b>${esc(fmtDay(party.rsvpBy))}</b>${rsvpPassed(party.rsvpBy) ? ' <span class="text-rose-600">(deadline passed)</span>' : ''}</p>` : ''}
            ${party.phone ? `<p>📞 Host: <a href="${esc(telHref(party.phone))}" class="text-indigo-600 underline">${esc(party.phone)}</a></p>` : ''}
            <p class="text-slate-400">Invitation for ${esc(email)}</p>
          </div>
          ${party.note ? `<div class="mt-3 text-left bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm whitespace-pre-line">💌 ${esc(party.note)}</div>` : ''}
          ${extrasHtml()}
          <div class="grid grid-cols-2 gap-3 mt-6">
            <button id="decline" class="py-3 rounded-xl border-2 border-slate-300 font-semibold hover:bg-slate-50">Cancel</button>
            <button id="accept" class="py-3 rounded-xl bg-emerald-500 text-white font-semibold hover:bg-emerald-600 shadow">Accept</button>
          </div>
        </div>
      </div>`;
      wireExtras();
      const cap = Math.max(1, Math.min(20, Number(party.maxPeople) || 20));        // host's plan limit, copied onto the party when saved
      $('#accept').onclick = () => { $('#guestCountInput').max = cap; $('#nameModal').classList.remove('hidden'); $('#guestNameInput').focus(); };
      $('#decline').onclick = () => submit('declined', '', 0);
      $('#nameCancel').onclick = () => $('#nameModal').classList.add('hidden');
      $('#nameConfirm').onclick = () => {
        const n = $('#guestNameInput').value.trim();
        if (!n) { $('#nameErr').classList.remove('hidden'); return; }
        const cnt = Math.max(1, Math.min(cap, parseInt($('#guestCountInput').value, 10) || 1));
        $('#nameModal').classList.add('hidden');
        submit('accepted', n, cnt);
      };
    }

    async function submit(status, name, count = 0) {
      try {
        await Repo.invitation.reply({ owner, pid, token }, { status, name, count });
      } catch (e) { console.error(e); return toast('Could not save your reply. Please try again.'); }
      mine = { status, name, count };
      notifyHost(status, name, count);
      done();
    }

    async function notifyHost(status, name, count) {
      if (!emailReady || HOST_EMAIL.startsWith('YOUR_')) return;
      try {
        const st = status === 'accepted' ? 'ACCEPTED' : 'DECLINED';
        const who = name || '(declined — no name given)';
        await (await mailer()).send(EMAILJS.serviceId, EMAILJS.templateId, {
          to_email: HOST_EMAIL,
          message_html: `<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#222;line-height:1.5"><p><b>${esc(who)}</b> (${esc(email)}) has <b>${st}</b> the invitation to ${esc(party.name)}'s Birthday.</p>${st === 'ACCEPTED' ? `<p>👥 Number of guests: <b>${count}</b></p>` : ''}<p style="color:#666;font-size:13px">Replied at: ${esc(new Date().toLocaleString())}</p></div>`,
          subject: `RSVP: ${who} ${st}`,
          guest_count: st === 'ACCEPTED' ? count : 0,
          message: `${who} (${email}) has ${st} the invitation to ${party.name}'s Birthday.${st === 'ACCEPTED' ? '\nNumber of guests: ' + count : ''}\nReplied at: ${new Date().toLocaleString()}`,
          party_name: party.name + "'s Birthday",
          guest_name: who,
          guest_email: email,
          status: st,
          responded_at: new Date().toLocaleString()
        });
      } catch (e) { console.warn('Email notification failed (RSVP is still saved):', e); }
    }

    function done() {
      const yes = mine.status === 'accepted';
      app.innerHTML = `
      <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 text-center">
        <div class="text-6xl mb-3">${yes ? '🎉' : '💌'}</div>
        <h1 class="text-2xl font-extrabold">${yes ? 'Thank you, your RSVP has been recorded!' : 'Thanks for letting us know'}</h1>
        <p class="text-slate-500 mt-2">${yes ? `We can't wait to celebrate with you, ${esc(mine.name)}.` : `We'll miss you at ${esc(party.name)}'s party.`}</p>
        ${yes ? `<p class="mt-2 text-slate-600">👥 ${mine.count} guest${mine.count === 1 ? '' : 's'} in your party</p>
        <p class="mt-1 text-sm">📍 <a href="${esc(mapUrl(party.venue))}" target="_blank" rel="noopener" class="text-indigo-600 underline">${esc(party.venue)}</a></p>
        ${extrasHtml()}` : ''}
        <button id="change" class="mt-6 text-sm text-slate-400 underline">Change my response</button>
      </div>`;
      if (yes) wireExtras();
      $('#change').onclick = () => { mine = null; render(); };
    }
  }


  /* ====================================================================================================
     ADMIN SCREENS — separate from every host screen. Talks only to Firestore (via P) and AdminRules /
     PlanRules / DiscountRules. React: <AdminLayout> with one component per tab.
     ==================================================================================================== */
  function makeAdminScreens({ getUser, getRole, getAdminEmails, onPlansChanged, onAdminsChanged }) {
    const ALL_TABS = [['overview', 'Overview'], ['plans', 'Plans & limits'], ['clients', 'Clients'], ['users', 'Users'], ['discounts', 'Discounts'], ['admins', 'Admins']];
    const tabsFor = () => ALL_TABS.filter(([id]) => (id !== 'admins' || AdminRules.can(getRole(), 'manageAdmins')) && (id !== 'plans' || AdminRules.can(getRole(), 'managePlans')));   // Admins + Plans tabs: Super Admin only
    const tabBar = (tab) => `<div role="tablist" aria-label="Admin sections" class="mb-6 inline-flex flex-wrap rounded-xl bg-slate-100 p-1 text-sm font-medium">${tabsFor().map(([id, l]) =>
      `<a href="#/admin/${id}" role="tab" aria-selected="${tab === id}" class="rounded-lg px-4 py-1.5 ${tab === id ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${l}</a>`).join('')}</div>`;
    const loadErr = (e) => `<p class="rounded-lg bg-rose-50 p-3 text-sm text-rose-700">Could not load: ${esc(e.message || e)}. Make sure the latest Firestore rules are published.</p>`;
    const inp = 'mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm';
    const today = () => PlanRules.dayKey(new Date());
    const Stat = (label, value, color) => `<div class="${color} rounded-2xl p-4 text-white shadow"><div class="text-3xl font-extrabold">${value}</div><div class="text-sm opacity-90">${label}</div></div>`;
    const fmtTs = (ts) => ts && ts.toDate ? ts.toDate().toLocaleDateString() : '—';

    const sections = {

      /* ----- Overview: platform metrics + maintenance switch ----- */
      async overview(box) {
        let users, parties, cfg, subRows = [], plansAll = [];
        try { [users, parties, cfg] = await Promise.all([Repo.users.count(), Repo.parties.countAll(), Repo.config.get()]); }
        catch (e) { box.innerHTML = loadErr(e); return; }
        try { [subRows, plansAll] = await Promise.all([Repo.subscriptions.listAll(), Repo.plans.list()]); } catch (e) { console.warn('subscription metrics skipped', e); }
        const subBd = AdminRules.subscriptionBreakdown(subRows, plansAll);
        const draw = () => {
          box.innerHTML = `
          <div class="grid grid-cols-2 gap-3 sm:max-w-2xl sm:grid-cols-4">${Stat('Users signed up', users, 'bg-indigo-500')}${Stat('Parties created', parties, 'bg-violet-500')}${Stat('Active subscriptions', subBd.reduce((n, b) => n + b.count, 0), 'bg-emerald-500')}${Stat('Maintenance', cfg.maintenance ? 'ON' : 'Off', cfg.maintenance ? 'bg-rose-500' : 'bg-slate-500')}</div>
          <div class="mt-3 flex flex-wrap gap-2 text-sm">${subBd.map(b => `<span class="rounded-full bg-emerald-50 px-3 py-1 text-emerald-700">${esc(b.name)}: <b>${b.count}</b></span>`).join('') || '<span class="text-slate-400">No active subscriptions yet.</span>'}</div>
          <p class="mt-2 text-xs text-slate-400">Counts cover all hosts. “Parties” may include small placeholders left by migrated v16 parties.</p>
          <section class="card mt-6">
            <div class="flex items-start justify-between gap-4">
              <div><h2 class="text-lg font-semibold">Maintenance mode</h2>
                <p class="mt-1 text-sm text-slate-500">When on, everyone except admins sees the “Under maintenance” page. Guest invitation links keep working.</p></div>
              <button id="mmSwitch" role="switch" aria-checked="${!!cfg.maintenance}" aria-label="Maintenance mode" class="relative h-7 w-12 shrink-0 rounded-full transition-colors ${cfg.maintenance ? 'bg-rose-500' : 'bg-slate-300'}">
                <span class="absolute top-0.5 h-6 w-6 rounded-full bg-white shadow transition-all ${cfg.maintenance ? 'left-[1.4rem]' : 'left-0.5'}"></span></button>
            </div>
            <p class="mt-3 text-sm font-medium ${cfg.maintenance ? 'text-rose-600' : 'text-emerald-600'}">${cfg.maintenance ? '● Maintenance is ON' : '● Site is live'}</p>

          });

            <input id="cpCode" placeholder="Coupon code" autocomplete="off" class="flex-1 rounded-xl border border-slate-300 px-3 py-2 text-sm uppercase">
            <button class="btn-soft">Apply</button></form>
          <p id="cpMsg" role="status" class="mt-2 text-center text-sm"></p>
          <p class="mt-6 text-center"><button id="ppOut" class="text-sm text-slate-400 underline">Sign out</button></p>
        </div>`;
        $('#ppOut').onclick = () => Repo.auth.signOut();
        $('#cpForm').onsubmit = async (e) => {
          e.preventDefault();
          const msg = $('#cpMsg'), code = DiscountRules.normalizeCode($('#cpCode').value);
          const say = (m, ok) => { msg.textContent = m; msg.className = 'mt-2 text-center text-sm font-medium ' + (ok ? 'text-emerald-600' : 'text-rose-600'); };
          if (!code) return say('Enter a coupon code.', false);
          try {
            const d = await Repo.discounts.lookup(code);
            const st = d ? DiscountRules.discountState(d, PlanRules.dayKey()) : '';
            if (!d || st !== 'Active') { coupon = null; say(d ? 'That code is not valid right now.' : 'Code not found.', false); }
            else { coupon = d; say(`✓ ${DiscountRules.formatValue(d)} off — applies when paid plans launch. (Not redeemed yet.)`, true); }
          } catch (er) { coupon = null; say('Could not check the code. Try again.', false); }
          const keep = msg.textContent, cls = msg.className, val = $('#cpCode').value; draw(); $('#cpMsg').textContent = keep; $('#cpMsg').className = cls; $('#cpCode').value = val;
        };
        app.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
          b.disabled = true; b.textContent = 'Setting up…';
          try {
            await Repo.subscriptions.startFree(user.uid, b.dataset.pick, '', PlanRules.expiryFor(plansList.find(x => x.id === b.dataset.pick)));
            await loadAccount(); mode = null; gate(); location.hash = '#/dashboard';
          } catch (er) { console.error(er); b.disabled = false; b.textContent = 'Continue with Free Plan'; toast('Could not start your plan: ' + er.message, 7000); }
        });
      };
      draw();
    }

    // Every sign-in the person starts lands on the Dashboard (a plain page reload keeps whatever page they were on).
    let landOnDashboard = false;
    const signIn = () => { landOnDashboard = true; return Repo.auth.signInWithGoogle().catch(e => { landOnDashboard = false; toast(e.message); }); };

    function renderMaintenance(signedIn) {
      app.innerHTML = `
      <div class="mx-auto mt-10 max-w-md rounded-3xl bg-white p-8 text-center shadow-xl">
        <div class="text-6xl">🛠️</div>
        <h1 class="mt-3 text-2xl font-extrabold">Under maintenance</h1>
        <p class="mt-2 text-slate-600">${esc(appConfig.message) || 'Birthday Bash is down for scheduled maintenance. We’ll be back shortly — thank you for your patience!'}</p>
        <p class="mt-3 text-sm text-slate-400">Invitation links you received still work for RSVPs.</p>
        ${signedIn ? `<button id="mOut" class="btn-line mt-6">Sign out</button>` : `<button id="mAdmin" class="mt-6 text-sm text-slate-400 underline">Sign in</button>`}
      </div>`;
      if (signedIn) $('#mOut').onclick = () => Repo.auth.signOut();
      else $('#mAdmin').onclick = signIn;
    }

    function renderSignIn() {
      app.innerHTML = `
      <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl p-8 text-center mt-10">
        <div class="text-6xl mb-3">🎂</div>
        <h1 class="text-2xl font-extrabold">Birthday Bash</h1>
        <p class="text-slate-500 mt-2 mb-6">Sign in to create invitations and track replies live.</p>
        <button id="signin" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-amber-500 text-white font-semibold shadow hover:opacity-90">Sign in with Google</button>
      </div>`;
      $('#signin').onclick = signIn;
    }

    /* ---------- Account: role, plan + limits ---------- */
    // Role comes from the verified email (+ the admins list); it is never read from an editable profile field.
    function setRole() {
      role = AdminRules.getRole(user && user.email, adminEmails);
      isAdminUser = AdminRules.isAdmin(user && user.email, adminEmails);
      const badge = $('#userRole'), label = { SUPER_ADMIN: 'Super Admin', ADMIN: 'Admin' }[role];
      badge.textContent = label || ''; badge.classList.toggle('hidden', !label);
    }
    async function loadRole(u) {
      adminEmails = [];
      try { if (await Repo.admins.has((u.email || '').toLowerCase())) adminEmails = [u.email]; } catch { /* not readable: the Super Admin is still recognised from config */ }
      setRole(); renderNav();
    }
    async function loadAdminList() {                 // after the Super Admin edits the list, refresh own state
      renderNav();
    }
    async function loadAccount() {
      let legacyPlanId = null;
      [plansList, legacyPlanId, mySubs] = await Promise.all([
        Repo.plans.list().catch(() => []), Repo.profile.planId(user.uid).catch(() => null), Repo.subscriptions.list(user.uid).catch(() => [])]);
      myPlanId = PlanRules.currentPlanId(mySubs, legacyPlanId);
      // A lapsed paid plan has no active subscription but a stale planId: that host falls back to the default plan. Data is kept.
      myPlan = PlanRules.applyAdminExemption(PlanRules.resolveLimits(plansList, myPlanId), isAdminUser);   // admins: no limits
      myPass = PlanRules.passStatus(PlanRules.activeSubscription(mySubs));
    }

    const createdCount = () => parties.length;                       // lifetime count: hosts without the delete privilege can never lose a party
    const createCheck = () => PlanRules.canUserCreateParty(myPlan, createdCount(), { isAdmin: isAdminUser, pass: myPass });
    const feat = (key) => PlanRules.featureCheck(myPlan, key, { isAdmin: isAdminUser });       // every plan feature goes through this one check
    const passOk = () => PlanRules.passBlock(myPlan, myPass, { isAdmin: isAdminUser });

    /* ---------- Parties + live guests ---------- */
    async function loadParties() {
      const [list, leg] = await Promise.all([Repo.parties.list(user.uid), Repo.legacy.list(user.uid).catch(e => { console.warn('legacy check skipped', e); return []; })]);
      parties = list; legacy = leg;
      // One live guest listener per party; drop listeners for parties that no longer exist.
      const ids = new Set(parties.map(p => p.id));
      Object.keys(subs).forEach(id => { if (!ids.has(id)) { subs[id](); delete subs[id]; delete gmap[id]; } });
      parties.forEach(p => {
        if (subs[p.id]) return;
        subs[p.id] = Repo.guests.watch(user.uid, p.id, (list) => { gmap[p.id] = list; onGuestsChanged(p.id); }, (e) => console.warn('guest listener', e));
      });
    }

    /* ---------- Email + links (take the party explicitly: no hidden "current") ---------- */
    const inviteReady = () => emailReady && !EMAILJS.inviteTemplateId.startsWith('YOUR_');
    const guestLink = (p, g) => {
      const u = new URL(baseUrl());
      u.searchParams.set('o', user.uid);
      u.searchParams.set('partyId', p.id);
      u.searchParams.set('guestEmail', g.email);
      u.searchParams.set('t', g.id);
      return u.toString();
    };
    async function sendInviteEmail(current, g, reminder = false) {
      const t = turning(current.birth, current.when);
      const when = fmtRange(current.when, current.endWhen);
      const title = `${current.name}'s ${t ? ord(t) + ' ' : ''}Birthday`;
      const link = guestLink(current, g);
      const subject = reminder ? `Reminder: please RSVP to ${title} 🎈` : `You're invited to ${title}! 🎉`;
      const heading = reminder ? `🎈 A friendly reminder: ${esc(title)}` : `🎉 You're invited to ${esc(title)}!`;
      const html = `<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#222;line-height:1.5">
<h2 style="color:#db2777;margin:0 0 6px">${heading}</h2>
${reminder ? `<p style="margin:0 0 12px">We haven't heard from you yet. We'd love to know if you can make it!</p>` : ''}
${t ? `<p style="font-size:18px;font-weight:bold;color:#d97706;margin:0 0 12px">🎈 Turning ${t}!</p>` : ''}
<p style="margin:4px 0">📅 <b>${esc(when)}</b></p>
<p style="margin:4px 0">📍 <a href="${esc(mapUrl(current.venue))}" style="color:#4f46e5">${esc(current.venue)}</a> <span style="color:#888;font-size:12px">(tap for map)</span></p>
${current.theme ? `<p style="margin:4px 0">👗 Dress code / theme: <b>${esc(current.theme)}</b></p>` : ''}
${current.rsvpBy ? `<p style="margin:4px 0">⏰ Please reply by <b>${esc(fmtDay(current.rsvpBy))}</b></p>` : ''}
${current.phone ? `<p style="margin:4px 0">📞 Host: <a href="${esc(telHref(current.phone))}" style="color:#4f46e5">${esc(current.phone)}</a></p>` : ''}
${current.note ? `<p style="margin:12px 0;padding:10px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;white-space:pre-line">💌 ${esc(current.note)}</p>` : ''}
<p style="margin:20px 0 10px"><a href="${esc(link)}" style="background:#ec4899;color:#ffffff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block">RSVP now</a></p>
<p style="margin:0 0 16px"><a href="${esc(googleCalUrl(current))}" style="color:#4f46e5">📆 Add to Google Calendar</a></p>
<p style="font-size:12px;color:#666;margin:0">If the button doesn't work, open this link:<br><a href="${esc(link)}">${esc(link)}</a></p>
</div>`;
      const text = [
        reminder ? `Friendly reminder: ${title}. We haven't heard from you yet.` : `You're invited to ${title}!${t ? ' (Turning ' + t + ')' : ''}`,
        '',
        `📅 ${when}`,
        `📍 ${current.venue}`,
        current.theme ? `👗 Dress code / theme: ${current.theme}` : '',
        current.rsvpBy ? `⏰ Please reply by ${fmtDay(current.rsvpBy)}` : '',
        current.phone ? `📞 Host: ${current.phone}` : '',
        current.note ? `\n💌 ${current.note}` : '',
        '',
        'Please RSVP here:',
        link
      ].filter((x, i, a) => x !== '' || a[i - 1] !== '').join('\n');
      await (await mailer()).send(EMAILJS.serviceId, EMAILJS.inviteTemplateId, {
        to_email: g.email,
        message_html: html,
        subject,
        message: text,
        party_name: title,
        party_when: when,
        party_venue: current.venue,
        invite_link: link
      });
      // Count it for the admin Users tab (best effort — never blocks the email flow).
      try { await Repo.parties.addSent(user.uid, current.id, 1); if (!reminder && g.id) await Repo.guests.markSent(user.uid, current.id, g.id); }
      catch (e) { console.warn('send not tracked', e); }
    }

    const adminScreens = makeAdminScreens({ getUser: () => user, getRole: () => role, getAdminEmails: () => adminEmails, onPlansChanged: loadAccount, onAdminsChanged: loadAdminList });

    /* =====================  SCREENS  =====================
       Each screen = { title, view(id) -> html, mount(id) -> wires events }.
       React: each becomes a component rendered by a <Route>. */
    const ROUTES = {

      /* ---------- Dashboard: always the landing page ---------- */
      dashboard: {
        title: () => 'Dashboard',
        view(tab) {
          tab = tab === 'past' ? 'past' : 'upcoming';
          const { open: upcoming, closed: past } = PartyRules.splitByStatus(parties);   // Closed parties never reach the summary widgets
          const c = PartyRules.summarizeParties(upcoming, gmap);
          const card = (p) => {
            const k = PartyRules.tally(gmap[p.id] || []), t = turning(p.birth, p.when), st = PartyRules.getEventStatus(p);
            const stCls = { Upcoming: 'bg-indigo-100 text-indigo-700', Active: 'bg-emerald-100 text-emerald-700', Closed: 'bg-slate-200 text-slate-600' }[st];
            const stLine = st === 'Closed' ? '🔒 Closed' : st === 'Active' ? '🎉 Happening now' : countdownText(p.when);
            return `<a href="#/party/${p.id}" class="party-card group" aria-label="Manage ${esc(partyTitle(p))}">
              <div class="flex items-center gap-4">
                <img src="${esc(p.photo || placeholderImg)}" onerror="this.src='${placeholderImg}'" alt="" class="h-20 w-20 shrink-0 rounded-xl object-cover">
                <div class="min-w-0 flex-1">
                  <h3 class="font-semibold leading-tight">${esc(partyTitle(p))}${t ? `<span class="block text-sm font-bold text-pink-600">turning ${t}</span>` : ''}</h3>
                  <span class="inline-block rounded-full px-2 py-0.5 text-xs font-medium ${stCls}">${st}</span>
                  <p class="truncate text-sm text-slate-500">📅 ${esc(fmtDate(p.when))}</p>
                  <p class="truncate text-sm text-slate-500">📍 ${esc(p.venue)}</p>
                  <p class="mt-1 text-sm font-medium text-pink-600">${esc(stLine)}</p>
                </div>
                <span aria-hidden="true" class="shrink-0 text-2xl text-slate-300 transition group-hover:translate-x-1 group-hover:text-indigo-500">›</span>
              </div>
              <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
                <span class="rounded-full bg-indigo-100 px-2 py-0.5 text-indigo-700">✉️ ${k.total} invited</span>
                <span class="rounded-full bg-emerald-100 px-2 py-0.5 text-emerald-700">${k.accepted} accepted</span>
                <span class="rounded-full bg-rose-100 px-2 py-0.5 text-rose-700">${k.declined} declined</span>
                <span class="rounded-full bg-amber-100 px-2 py-0.5 text-amber-700">${k.pending} pending</span>
                <span class="rounded-full bg-sky-100 px-2 py-0.5 text-sky-700">👥 ${k.people} attending</span>
              </div>
              <div class="mt-3 border-t border-slate-100 pt-3 text-sm font-semibold text-indigo-600">${st === 'Closed' ? 'View guests & replies' : 'Manage party & guests'} <span aria-hidden="true" class="inline-block transition group-hover:translate-x-1">→</span></div>
            </a>`;
          };
          const empty = `<div class="card py-12 text-center">
            <div class="text-5xl">🎈</div>
            <h2 class="mt-3 text-lg font-semibold">No parties yet</h2>
            <p class="mt-1 text-sm text-slate-500">Create your first party and start inviting guests.</p>
            <a href="#/new" class="btn-primary mt-5 inline-block">Create your first party</a>
          </div>`;
          const banner = legacy.length ? `<div class="mb-6 rounded-xl border border-amber-300 bg-amber-50 p-4 text-sm">
            <p class="font-semibold text-amber-900">📦 ${legacy.length} party${legacy.length > 1 ? 'ies' : ''} from the older version ${legacy.length > 1 ? 'are' : 'is'} not in your account yet</p>
            <p class="mt-1 text-amber-800">Move ${legacy.length > 1 ? 'them' : 'it'} into your account once. Guest links already sent keep working.</p>
            <button id="migrateBtn" class="btn-soft mt-3 !bg-amber-100 !text-amber-900 hover:!bg-amber-200">Move to my account</button></div>` : '';
          return `${banner}
          <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
            ${Stat('Active &amp; upcoming parties', c.parties, 'bg-violet-500')}
            ${Stat('Total invited', c.total, 'bg-indigo-500')}
            ${Stat('Accepted', c.accepted, 'bg-emerald-500')}
            ${Stat('Pending', c.pending, 'bg-amber-500')}
            ${Stat('People attending', c.people, 'bg-sky-500 col-span-2 sm:col-span-1')}
          </div>
          <p class="mt-2 text-xs text-slate-400">Summary covers active and upcoming parties only — closed parties are in the Past / Closed tab.</p>
          ${parties.length ? `
          <div class="mt-8 flex flex-wrap items-center justify-between gap-3">
            <div role="tablist" aria-label="Party lists" class="inline-flex rounded-xl bg-slate-100 p-1 text-sm font-medium">
              <a href="#/dashboard/upcoming" role="tab" aria-selected="${tab === 'upcoming'}" class="rounded-lg px-4 py-1.5 ${tab === 'upcoming' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">Upcoming Parties (${upcoming.length})</a>
              <a href="#/dashboard/past" role="tab" aria-selected="${tab === 'past'}" class="rounded-lg px-4 py-1.5 ${tab === 'past' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">Past / Closed (${past.length})</a>
            </div>
            <a href="#/new" class="btn-primary !py-2 text-sm">+ New Party</a>
          </div>
          ${(() => { const list = tab === 'past' ? past : upcoming;
            return list.length ? `<div class="mt-4 grid gap-4 md:grid-cols-2">${list.map(card).join('')}</div>`
              : `<div class="card mt-4 py-10 text-center"><div class="text-4xl">${tab === 'past' ? '📭' : '🎈'}</div><p class="mt-2 text-sm text-slate-500">${tab === 'past' ? 'No closed parties yet.' : 'No upcoming parties.'}</p>${tab === 'past' ? '' : '<a href="#/new" class="btn-primary mt-4 inline-block !py-2 text-sm">Create a party</a>'}</div>`; })()}` : `<div class="mt-8">${empty}</div>`}`;
        },
        mount() {
          const btn = $('#migrateBtn'); if (!btn) return;
          btn.onclick = async () => {
            btn.disabled = true; btn.textContent = 'Moving…';
            try { await Repo.legacy.migrate(user.uid, legacy); await loadParties(); toast('Parties moved to your account', 5000); renderMain(true); }
            catch (e) { console.error(e); btn.disabled = false; btn.textContent = 'Move to my account'; toast('Could not move: ' + e.message, 8000); }
          };
        },
      },

      /* ---------- Party details: guests, invites, actions ---------- */
      party: {
        title: (id) => { const p = getParty(id); return p ? partyTitle(p) : 'Party'; },
        view(id) {
          const p = getParty(id);
          const t = turning(p.birth, p.when);
          return `
          <a href="#/dashboard" class="text-sm text-indigo-600 hover:underline">← All parties</a>
          <section class="card mt-3">
            <div class="flex items-start gap-4">
              <div class="flex w-24 shrink-0 flex-col gap-2 sm:w-28">
                <img src="${esc(p.photo || placeholderImg)}" onerror="this.src='${placeholderImg}'" alt="" class="aspect-square w-full rounded-xl object-cover">
                <a href="#/edit/${p.id}" class="btn-soft whitespace-nowrap text-center !px-2 text-xs">✏️ Edit party</a>
              </div>
              <div class="min-w-0 flex-1">
                <h2 class="text-xl font-extrabold leading-tight">${esc(partyTitle(p))}${t ? `<span class="mt-0.5 block text-base font-bold text-pink-600">turning ${t}</span>` : ''}</h2>
                <p class="text-sm text-slate-600">📅 ${esc(fmtRange(p.when, p.endWhen))}</p>
                <p class="text-sm text-slate-600">📍 <a class="text-indigo-600 underline" target="_blank" rel="noopener" href="${esc(mapUrl(p.venue))}">${esc(p.venue)}</a></p>
                ${p.theme ? `<p class="text-sm text-slate-600">👗 ${esc(p.theme)}</p>` : ''}
                ${p.rsvpBy ? `<p class="text-sm text-slate-600">⏰ Reply by ${esc(fmtDay(p.rsvpBy))}</p>` : ''}
                <p class="mt-1 text-sm font-medium text-pink-600">${PartyRules.isClosed(p) ? '🔒 Closed' : esc(countdownText(p.when))}</p>
              </div>
            </div>
          </section>

          <section class="card mt-6">
            <h2 class="mb-4 text-lg font-bold">Invite guests</h2>
            <form id="inviteForm" class="flex flex-col gap-2 sm:flex-row">
              <input id="invEmails" type="text" placeholder="guest@email.com (several allowed, separated by commas)" class="flex-1 rounded-lg border border-slate-300 px-3 py-2">
              <button class="rounded-lg bg-indigo-600 px-5 py-2 font-semibold text-white hover:bg-indigo-700">Send Invite</button>
            </form>
            <p id="inviteNote" role="status" class="mt-2 text-xs text-slate-400">&nbsp;</p>

          </section>

          <div id="dash"></div>`;
        },
        mount(id) {
          const p = getParty(id);
          renderDash(id);
          let log = [];                                              // this party's invitation log (the rolling limit counts it)
          const note = () => {
            const el = $('#inviteNote'); if (!el) return;
            const w = PlanRules.invitationWindow(log, myPlan.limits);
            el.textContent = PlanRules.inviteStatusLine(w); el.className = 'mt-2 text-xs ' + (w.remaining === 0 ? 'font-medium text-rose-600' : 'text-slate-500');
          };
          Repo.invitations.list(user.uid, p.id).then(l => { log = l; note(); }).catch(e => { console.warn('invitation log unreadable', e); note(); });
          $('#inviteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const guests = gmap[id] || [];
            const list = [...new Set($('#invEmails').value.split(/[,\s;]+/).map(s => s.trim().toLowerCase()).filter(Boolean))];
            const bad = list.filter(s => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s));
            if (!list.length) return toast('Enter at least one email');
            const blk = passOk(); if (!blk.ok) return toast(blk.message, 9000);
            if (bad.length) return toast('Invalid email: ' + bad[0]);
            const existing = new Set(guests.map(g => g.email));
            const fresh = list.filter(em => !existing.has(em));
            const dec = PlanRules.inviteDecision(PlanRules.invitationWindow(log, myPlan.limits), fresh.length);
            if (fresh.length && !dec.allowed) return toast(dec.message, 8000);
            const batch = fresh.slice(0, dec.allowed);
            let sent = 0, failed = 0, lastErr = '', stopped = false;
            const mailOn = inviteReady();                                    // the first invitation email goes out automatically on every plan (it counts toward the email limit)
            for (const email of batch) {
              let gid;
              try { gid = await Repo.invitations.add(user.uid, p.id, email); }
              catch (er) { console.warn('invite not saved', er); stopped = true; toast(er.limit ? 'The server refused this invitation. Make sure the latest rules are published and refresh the page (or the limit was just reached on another device).' : 'Could not save the invite: ' + er.message, 10000); break; }
              log.push({ email, at: Date.now() });
              if (mailOn) {
                try { await sendInviteEmail(p, { id: gid, email }); sent++; }
                catch (err) { console.warn('Invite email failed', err); failed++; lastErr = (err && (err.text || err.message)) || JSON.stringify(err); }
              }
            }
            if (stopped) { note(); return; }
            $('#invEmails').value = dec.ok ? '' : fresh.slice(dec.allowed).join(', ');          // anything over the limit stays in the box
            note();
            if (!fresh.length) toast('Already invited — use the Email button on the guest row to resend', 5000);
            else if (!dec.ok) toast(dec.message, 9000);
            else if (!inviteReady()) toast(`Saved, but invite emails are OFF (EmailJS not configured). Use Copy Link.`, 10000);
            else if (failed) toast(`Email FAILED (${failed}): ${lastErr}`, 15000);
            else toast(`${sent} invite email${sent > 1 ? 's' : ''} sent via EmailJS`, 6000);
          });
        },
      },

      /* ---------- Create / Edit party: form + live preview ---------- */
      new:  { title: () => 'Create party',
              view() { const c = createCheck();
                return c.ok ? partyForm(null) : `<section class="card py-10 text-center"><div class="text-5xl">🚧</div><h2 class="mt-3 text-lg font-semibold">Party limit reached</h2><p class="mx-auto mt-1 max-w-md text-sm text-slate-500">${esc(c.message)}</p><a href="#/dashboard" class="btn-line mt-5 inline-block">Back to dashboard</a></section>`; },
              mount() { if (createCheck().ok) mountForm(null); } },
      edit: { title: (id) => { const p = getParty(id); return p ? 'Edit ' + partyTitle(p) : 'Edit party'; }, view: (id) => partyForm(getParty(id)), mount: (id) => mountForm(getParty(id)) },

    function mountForm(p) {
      const touched = new Set();
      // UI <-> rules mapping: input id -> party field key. All rules live in PartyRules.
      const FIELDS = { fName: 'name', fBirth: 'birth', fWhen: 'when', fEnd: 'endWhen', fVenue: 'venue', fRsvp: 'rsvpBy' };
      const readValues = () => Object.fromEntries(Object.entries(FIELDS).map(([id, key]) => [key, $('#' + id).value]));
      const showErr = (id, msg) => {
        const el = $('#' + id), box = $('#e_' + id);
        box.textContent = msg; box.classList.toggle('hidden', !msg);
        el.classList.toggle('!border-rose-500', !!msg); el.setAttribute('aria-invalid', msg ? 'true' : 'false'); el.setAttribute('aria-describedby', 'e_' + id);
      };
      // Errors show for fields the user has touched, any non-empty bad value, or everything on submit. Returns first invalid input id.
      const validate = (all = false) => {
        const values = readValues(), ctx = { original: p };
        const res = PartyRules.validateParty(values, ctx);
        Object.entries(FIELDS).forEach(([id, key]) => {
          const msg = res.errors[key] || '';
          showErr(id, msg && (all || touched.has(id) || values[key]) ? msg : '');
        });
        const lim = PartyRules.pickerLimits(values, ctx);
        $('#fWhen').min = lim.startMin; $('#fEnd').min = lim.endMin; $('#fRsvp').max = lim.rsvpMax;
        return res.firstInvalid ? Object.keys(FIELDS).find((id) => FIELDS[id] === res.firstInvalid) : null;
      };
      Object.keys(FIELDS).forEach((id) => ['input', 'change', 'blur'].forEach((ev) => $('#' + id).addEventListener(ev, () => { touched.add(id); validate(); })));
      validate();
      const setPrev = (src) => { photoData = src; $('#photoPrev').src = src || placeholderImg; live(); };
      const live = () => {
        $('#cardName').textContent = $('#fName').value ? $('#fName').value + "'s Birthday" : 'Your party name';
        $('#cardBirth').textContent = $('#fBirth').value ? 'Born ' + fmtBirth($('#fBirth').value) : '';
        const tn = turning($('#fBirth').value, $('#fWhen').value);
        $('#cardTurning').textContent = tn ? '🎈 Turning ' + tn + '!' : '';
        $('#cardTurning').classList.toggle('hidden', !tn);
        $('#cardWhen').textContent = $('#fWhen').value ? '📅 ' + fmtRange($('#fWhen').value, $('#fEnd').value) : '';
        $('#cardTheme').textContent = $('#fTheme').value.trim() ? '👗 ' + $('#fTheme').value.trim() : '';
        $('#cardRsvp').textContent = $('#fRsvp').value ? '⏰ Reply by ' + fmtDay($('#fRsvp').value) : '';
        $('#cardPhone').textContent = $('#fPhone').value.trim() ? '📞 ' + $('#fPhone').value.trim() : '';
        $('#cardVenue').textContent = $('#fVenue').value ? '📍 ' + $('#fVenue').value : '';
        $('#cardCountdown').textContent = $('#fWhen').value ? countdownText($('#fWhen').value) : '';
        $('#cardNote').textContent = $('#fNote').value.trim() ? '💌 ' + $('#fNote').value.trim() : '';
        $('#cardImg').src = photoData || placeholderImg;
      };
      ['fName', 'fBirth', 'fWhen', 'fEnd', 'fVenue', 'fTheme', 'fRsvp', 'fPhone', 'fNote'].forEach(id => $('#' + id).addEventListener('input', live));
      $('#photoUrl').addEventListener('input', e => setPrev(e.target.value.trim()));
      $('#photoFile').addEventListener('change', e => {
        const input = e.target;
        const f = input.files && input.files[0];
        input.value = '';            // lets you pick the same file again and still get a change event
        if (!f) return;
        const img = new Image(), url = URL.createObjectURL(f);
        img.onload = () => {
          try {
            // Shrink until the photo fits the plan's size limit.
            const maxKB = myPlan.limits.maxPhotoKB, maxBytes = maxKB * 1024;
            let max = 600, q = 0.75, out = '';
            for (let i = 0; i < 10; i++) {
              const r = Math.min(1, max / Math.max(img.width, img.height));
              const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * r)); cv.height = Math.max(1, Math.round(img.height * r));
              cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
              out = cv.toDataURL('image/jpeg', q);
              if (PlanRules.dataUrlBytes(out) <= maxBytes) break;
              if (q > 0.45) q -= 0.15; else max = Math.round(max * 0.8);
            }
            if (PlanRules.dataUrlBytes(out) > maxBytes) toast(`That photo is too large for your plan (max ${maxKB} KB). Try a smaller image.`, 6000);
            else { $('#photoUrl').value = ''; setPrev(out); toast('Photo added'); }
          } catch (err) { console.error(err); toast('Could not process that photo. Try a JPG or PNG.', 6000); }
          URL.revokeObjectURL(url);
        };
        img.onerror = () => { URL.revokeObjectURL(url); toast('That photo format isn\'t supported (HEIC?). Try a JPG or PNG.', 6000); };
        img.src = url;
      });

      $('#partyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = { name: $('#fName').value.trim(), birth: $('#fBirth').value, when: $('#fWhen').value, endWhen: $('#fEnd').value, venue: $('#fVenue').value.trim(),
          theme: $('#fTheme').value.trim(), rsvpBy: $('#fRsvp').value, phone: $('#fPhone').value.trim(), note: $('#fNote').value.trim(), photo: photoData || '', maxPeople: myPlan.limits.maxPeoplePerRsvp };
        const bad = validate(true);
        if (bad) { $('#' + bad).focus(); return toast('Please fix the highlighted fields', 4000); }
        if (!p) { const c = createCheck(); if (!c.ok) return toast(c.message, 9000); }
        const btn = $('#saveBtn'); btn.disabled = true;
        try {
          let id;
          if (p) { await Repo.parties.update(user.uid, p.id, data); id = p.id; }
          else id = await Repo.parties.create(user.uid, data);
          await loadParties();
          toast('Event saved');
          location.hash = '#/party/' + id;
        } catch (err) { console.error(err); btn.disabled = false; toast(err.limit ? 'The server refused this party. Make sure the latest rules are published and refresh the page.' : 'Could not save: ' + err.message, 9000); }
      });
    }

    /* ---------- Party guest table + actions (live, re-rendered on each snapshot) ---------- */
    function renderDash(id) {
      const box = $('#dash'); if (!box) return;
      const current = getParty(id); if (!current) return;
      const guests = gmap[id] || [];
      const c = PartyRules.tally(guests);
      const delChk = feat('deleteEvent'), expChk = feat('exportGuestList'), remChk = feat('reminderPending');
      const lockBtn = (label) => `<button disabled aria-describedby="lockNote" title="Not included in your plan" class="cursor-not-allowed rounded bg-slate-100 px-2 py-1 text-slate-400">${label}</button>`;
      box.innerHTML = `
      <section class="mt-6">

        <div class="grid grid-cols-2 gap-3 sm:grid-cols-5">
          ${Stat('Total invited', c.total, 'bg-indigo-500')}${Stat('Accepted', c.accepted, 'bg-emerald-500')}${Stat('Declined', c.declined, 'bg-rose-500')}${Stat('Pending', c.pending, 'bg-amber-500')}${Stat('People attending', c.people, 'bg-sky-500 col-span-2 sm:col-span-1')}
        </div>
        <ul class="mt-4 space-y-2">
          ${guests.length ? guests.map(g => `
          <li class="rounded-2xl bg-white p-3 shadow-sm ring-1 ring-slate-100">

              <span class="min-w-0 flex-1 truncate font-medium" title="${esc(g.email)}">${esc(g.email)}</span>
              <span class="shrink-0">${badge(g.status)}</span>
              <span class="max-w-[28%] shrink-0 truncate text-slate-600" title="${esc(g.name)}">${esc(g.name) || '<span class="text-slate-300">—</span>'}</span>
              <span class="shrink-0 text-slate-600" title="Guests in their party">${g.status === 'accepted' ? '👥 ' + (g.count || 1) : '<span class="text-slate-300">—</span>'}</span>
            </div>
            <div class="mt-2 flex flex-wrap justify-end gap-1 text-sm">
              ${feat('emailInvite').ok ? `<button data-mail="${g.id}" class="rounded bg-indigo-50 px-2 py-1 text-indigo-700 hover:bg-indigo-100">Email</button>` : lockBtn('Email')}
              ${feat('copyLinkShare').ok ? `<button data-copy="${g.id}" class="rounded bg-slate-100 px-2 py-1 hover:bg-slate-200">Copy Link</button>` : lockBtn('Copy Link')}
              ${feat('whatsappShare').ok ? `<button data-wa="${g.id}" class="rounded bg-green-500 px-2 py-1 text-white hover:bg-green-600">WhatsApp</button>` : lockBtn('WhatsApp')}
              ${feat('deleteInvites').ok ? `<button data-del="${g.id}" class="rounded bg-rose-50 px-2 py-1 text-rose-600 hover:bg-rose-100">Delete</button>` : lockBtn('Delete')}
            </div>
          </li>`).join('') : `<li class="rounded-2xl bg-white p-6 text-center text-sm text-slate-400 shadow-sm">No invitees yet.</li>`}
        </ul>
        <div class="mt-3 flex flex-wrap justify-end gap-2">
          ${expChk.ok ? '<button id="exportCsv" class="rounded-lg bg-slate-100 px-3 py-1.5 text-sm hover:bg-slate-200">⬇️ Export guest list</button>'
            : '<button id="exportCsv" disabled aria-describedby="lockNote" title="Not included in your plan" class="cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-3 py-1.5 text-sm text-slate-400">⬇️ Export guest list</button>'}
          <button id="remindBtn" ${c.pending && remChk.ok ? '' : 'disabled'} ${remChk.ok ? '' : 'aria-describedby="lockNote"'} class="rounded-lg bg-indigo-50 px-3 py-1.5 text-sm text-indigo-700 hover:bg-indigo-100 ${c.pending && remChk.ok ? '' : 'cursor-not-allowed opacity-50'}">🔔 Remind pending (${c.pending})</button>
          ${remChk.ok ? '<button id="resetRsvps" class="btn-line">Reset all RSVPs</button>'
            : '<button id="resetRsvps" disabled aria-describedby="lockNote" title="Not included in your plan" class="cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-3 py-1.5 text-sm text-slate-400">Reset all RSVPs</button>'}
          ${delChk.ok ? '<button id="deleteParty" class="rounded-lg border border-rose-300 px-3 py-1.5 text-sm text-rose-600 hover:bg-rose-50">Delete event</button>'
            : '<button id="deleteParty" disabled aria-describedby="lockNote" class="cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-3 py-1.5 text-sm text-slate-400">Delete event</button>'}
        </div>
        ${(() => { const locked = PlanRules.FEATURES.filter(f => !feat(f.key).ok); return locked.length ? `<div id="lockNote" class="mt-2 text-right text-xs text-slate-500"><p>🔒 Not included in your ${esc(myPlan.planName)}: ${locked.map(f => esc(f.what)).join(' · ')}. Upgrade your plan to unlock ${locked.length > 1 ? 'them' : 'it'}!</p></div>` : ''; })()}
      </section>`;
      const byId = (gid) => guests.find(g => g.id === gid);
      box.querySelectorAll('[data-mail]').forEach(b => b.onclick = async () => {
        const fc = feat('emailInvite'); if (!fc.ok) return toast(fc.message, 6000);
        const pb = passOk(); if (!pb.ok) return toast(pb.message, 8000);
        if (!inviteReady()) return toast('Add your invite template ID first');
        try { await sendInviteEmail(current, byId(b.dataset.mail)); toast('Invite emailed'); }
        catch (e) { toast('Email failed: ' + (e.text || e.message || 'unknown error')); }
      });
      box.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { const fc = feat('copyLinkShare'); if (!fc.ok) return toast(fc.message, 6000); copy(guestLink(current, byId(b.dataset.copy))); });
      box.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {

        if (!guests.length) return toast('No guests to export yet');
        // Guest-typed names starting with = + - @ get a leading apostrophe so spreadsheets don't run them as formulas.
        const cell = (v) => { let x = String(v ?? ''); if (/^[=+\-@\t\r]/.test(x)) x = "'" + x; return '"' + x.replace(/"/g, '""') + '"'; };

          g.respondedAt && g.respondedAt.toDate ? g.respondedAt.toDate().toLocaleString() : ''

        for (const g of pend) {
          try { await sendInviteEmail(current, g, true); sent++; }
          catch (err) { failed++; lastErr = (err && (err.text || err.message)) || JSON.stringify(err); }
        }
        if (sent) { const ts = Date.now(); current.lastReminderAt = ts; try { await Repo.parties.update(user.uid, current.id, { lastReminderAt: ts }); } catch (e) { console.warn(e); } }
        if (failed) toast(`Reminders: ${sent} sent, ${failed} FAILED (${lastErr})`, 15000);
        else toast(`${sent} reminder${sent > 1 ? 's' : ''} sent`, 6000);
      };
      $('#resetRsvps').onclick = async () => {
        const rc = feat('reminderPending'); if (!rc.ok) return toast(rc.message, 6000);          // same switch as Remind pending
        if (!confirm(`Reset every guest of "${partyTitle(current)}" back to Pending?`)) return;
        await Repo.guests.resetAll(user.uid, current.id, guests.map(g => g.id)); toast('All RSVPs reset');
      };
      $('#deleteParty').onclick = async () => {
        const chk = PlanRules.canUserDeleteParty(myPlan, { isAdmin: isAdminUser });   // re-check at click time
        if (!chk.ok) return toast(chk.message, 6000);
        const pname = partyTitle(current);
        if (!confirm(`Delete "${pname}" and all ${guests.length} invite${guests.length === 1 ? '' : 's'}?\n\nThis cannot be undone.`)) return;
        try {
          await Repo.parties.remove(user.uid, current.id, guests.map(g => g.id));
          await loadParties();
          location.hash = '#/dashboard';
          toast(`"${pname}" deleted`, 5000);
        } catch (err) { console.error(err); toast('Could not delete: ' + err.message); }
      };
    }

    /* ---------- Render: state -> DOM ---------- */
    let shownKey = null;
    function renderChrome(name) {
      shell.dataset.open = ui.isOpen;
      shell.dataset.collapsed = ui.isCollapsed;
      menuBtn.setAttribute('aria-expanded', ui.isOpen);
      const label = ui.isCollapsed ? 'Expand sidebar' : 'Collapse sidebar';
      collapseBtn.setAttribute('aria-label', label); collapseBtn.title = label;
      collapseBtn.setAttribute('aria-expanded', !ui.isCollapsed);
      sidebar.inert = isMobile.matches && !ui.isOpen;           // closed drawer is unreachable by keyboard / screen reader
      document.body.classList.toggle('overflow-hidden', ui.isOpen && isMobile.matches);
      nav.querySelectorAll('.nav-link').forEach(a => {
        if (a.dataset.nav === NAV_FOR[name]) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
    }
    function renderMain(force = false) {
      if (!user || shell.hidden) return;
      let { name, id } = parseRoute();
      if (name === 'admin' && !isAdminUser) { location.hash = '#/dashboard'; return; }      // UI guard; the real protection is in firestore.rules
      if ((name === 'party' || name === 'edit') && !getParty(id)) {      // unknown / deleted party
        if (location.hash !== '#/dashboard') { location.hash = '#/dashboard'; return; }
        name = 'dashboard';
      }
      renderChrome(name);
      const key = name + '/' + id;
      if (!force && key === shownKey) return;
      shownKey = key;
      const r = ROUTES[name];
      main.innerHTML = r.view(id);
      r.mount?.(id);
      pageTitle.textContent = r.title(id);
      document.title = `${r.title(id)} · ${APP_NAME}`;
    }
    const renderAll = () => renderMain(true);

    // Live guest updates: refresh only what is safe (never the forms, so typing is not lost).
    function onGuestsChanged(pid) {
      if (shell.hidden) return;
      const { name, id } = parseRoute();
      if (name === 'dashboard') renderMain(true);
      else if (name === 'party' && id === pid) renderDash(pid);
    }

    /* ---------- Events ---------- */
    const actions = {
      open()     { ui.isOpen = true; renderChrome(parseRoute().name); sidebar.querySelector('.nav-link').focus(); },
      close()    { ui.isOpen = false; renderChrome(parseRoute().name); },
      collapse() { ui.isCollapsed = !ui.isCollapsed; store.set(ui.isCollapsed); renderChrome(parseRoute().name); },
      signout()  { ui.isOpen = false; Repo.auth.signOut(); },
    };
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (el && !shell.hidden) actions[el.dataset.action]?.();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && ui.isOpen) { actions.close(); menuBtn.focus(); }
    });
    addEventListener('hashchange', () => { ui.isOpen = false; renderMain(); main.focus({ preventScroll: true }); window.scrollTo(0, 0); });
    // Parties close on their own as time passes: re-render the dashboard when any party's status changes.
    let statusSig = '';
    setInterval(() => {
      const sig = parties.map(p => p.id + PartyRules.getEventStatus(p)).join();
      if (statusSig && sig !== statusSig && !shell.hidden && parseRoute().name === 'dashboard') renderMain(true);
      statusSig = sig;
    }, 20000);
    isMobile.addEventListener('change', () => { ui.isOpen = false; renderChrome(parseRoute().name); });
  }
}
</script>
</body>
</html>
